server:
  port: 8080

spring:
  application:
    name: dreamlens-backend
  config:
    import: "optional:application-local.yml"

dreamlens:
  ai:
    primary-provider: ${AI_PRIMARY_PROVIDER:groq}
    fallback-provider: ${AI_FALLBACK_PROVIDER:gemini}
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-1.5-flash}
      timeout-seconds: 15
    groq:
      api-key: ${GROQ_API_KEY:}
      model: ${GROQ_MODEL:llama-3.3-70b-versatile}
      timeout-seconds: 15
  knowledge-base:
    path: ../knowledge-base/processed
